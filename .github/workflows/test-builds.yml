name: Desktop test builds

on:
  workflow_call:
    secrets:
      MAC_CERTIFICATE_P12_BASE64:
        required: false
      MAC_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_PRIVATE_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
    inputs:
      sign_macos:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Developer ID sign and notarize macOS using macos-signing environment
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'electron.vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/test-builds.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/macos-signed.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'electron.vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/test-builds.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/macos-signed.yml'
      - '.github/actions/**'

permissions:
  contents: read

concurrency:
  group: test-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.sign_macos && '[{"os":"windows-2022","platform":"windows","arch":"x64","command":"package:win"},{"os":"ubuntu-22.04","platform":"linux","arch":"x64","command":"package:linux"}]' || '[{"os":"windows-2022","platform":"windows","arch":"x64","command":"package:win"},{"os":"ubuntu-22.04","platform":"linux","arch":"x64","command":"package:linux"},{"os":"macos-15","platform":"macos","arch":"arm64","command":"package:mac"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/desktop-build
        with:
          command: ${{ matrix.command }}
  signed-macos:
    if: inputs.sign_macos
    uses: ./.github/workflows/macos-signed.yml
    secrets:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
