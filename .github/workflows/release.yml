name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and build without publishing a GitHub Release
        type: boolean
        default: true
        required: true
      sign_macos:
        description: Developer ID sign and notarize macOS (required for publishing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate version and tag
        env:
          REQUIRE_SIGNED_MAC: ${{ github.event_name == 'push' || inputs.sign_macos }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/prepare-release.cjs validate
  build:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/test-builds.yml
    secrets:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    with:
      sign_macos: ${{ github.event_name == 'push' || inputs.sign_macos }}
  assemble:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download this run's platform archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'OCLR-IRC-*' --dir release-input
      - name: Verify all archives and prepare release assets
        env:
          REQUIRE_SIGNED_MAC: ${{ github.event_name == 'push' || inputs.sign_macos }}
        run: node scripts/prepare-release.cjs assemble
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-assets
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: assemble
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name verified-release-assets --dir release-assets
      - name: Confirm remote tag still points to this build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          cd release-assets
          sha256sum --check SHA256SUMS.txt
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "OCLR IRC $RELEASE_TAG (test build)" \
            --notes-file release-assets/RELEASE_NOTES.md \
            release-assets/*.zip release-assets/*.tar.gz \
            release-assets/SHA256SUMS.txt release-assets/build-info.json
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
